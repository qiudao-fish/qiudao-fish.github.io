<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="gbk">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        #game {
            position: relative;
            width: 1100px;
            height: 810px;
            left: 301px;
            background-color: #ccc;
        }

        #chessboard {
            position: relative;
            /* width: 1100px;
            height: 710px;
            left: 301px; */

            /* line-height: 10px; */
        }

        .chess button {
            width: 51px;
            height: 51px;
            background-color: transparent;
            outline: none;
            border: 0;
            margin-left: -1px;
            background-size: cover;
            /* margin-bottom: -5px; */
            background-size: cover;
            background-image: url(image/pan3.png);
        }

        .chess button.black {
            background-image: url(image/black.png);
            /* border: 5px black; */
        }

        .chess button.white {
            background-image: url(image/white.png);
            /* border: 5px black; */
        }

        .chess button.other {
            background-image: url(image/white.png);
            /* border: 5px black; */
        }
        /* img {
            object-fit: fill;
        } */
    </style>
</head>

<body>
    <div id="game">
        <div id="chessboard" class="chess"></div>
        <p>
            <button>双人对战</button>
            <button>悔棋</button>
        </p>
    </div>
    <script>
        var parent = document.getElementById("chessboard");
        var clickCount = 0;
        var col = 21, row = 14;
        var board = new Array(row);
        for (var i = 0; i < row; i++) {
            board[i] = new Array(col);
        }
        for (var i = 0; i < row; i++) {
            var p = document.createElement("p");
            p.style.position = "absolute";
            p.style.top = i * 50 + "px";
            // alert(i * 100 + "px");
            parent.appendChild(p);
            for (var j = 0; j < col; j++) {
                var child = document.createElement("button");
                var res = 0;
                child.onclick = function () {
                    clickCount++;
                    if (clickCount % 2 == 1) {
                        // if(clickCount == 21){  //  后手
                        //     clickCount = 22;
                        // }
                        if (this.classList) {
                            this.classList.add("black");
                            this.class = "black";
                            var rect = this.getBoundingClientRect()  //  显示坐标
                            board[rect.top / 50][(rect.left - 300) / 50] = 1;  //  黑子是1，白子是0
                            //alert("top:" + rect.top + "left:" + rect.left);
                            res = isWin(rect.top / 50, (rect.left - 300) / 50, 1);
                            if (res == 1) {
                                alert("黑子赢了！");
                            }
                            //alert(board);
                        } else {
                            
                            
                        }
                    } else if (clickCount % 2 == 0) {
                        if (this.classList) {
                            this.classList.add("white");
                            this.class = "white";
                            var rect = this.getBoundingClientRect()  //  显示坐标
                            board[rect.top / 50][(rect.left - 300) / 50] = 2;  //  黑子是1，白子是0
                            //alert("top:" + rect.top + "left:" + rect.left);
                            res = isWin(rect.top / 50, (rect.left - 300) / 50, 2);
                            if (res == 2) {
                                alert("白子赢了！");
                            }
                            //alert(board);
                        } else {
                            this.class += "white";
                        }
                    }
                    
                }
                child.addEventListener("contextmenu", function(event){
                    event.preventDefault();
                    alert("dian");
                    child.class += "other";
                    p.appendChild(child);
                });
                // child.innerHTML = '<img src="image/pan.png" alt="棋盘">';
                p.appendChild(child);
            }
        }
        
        function isWin(x, y, choice) {
            var m = x, n = y;
            var num = 0;
            //  判断横向有没有连成五子
            while (n >= 0 && board[m][n] == choice) {
                num++;
                n--;
            }
            m = x; n = y + 1;
            while (n <= col - 1 && board[m][n] == choice) {
                num++;
                n++;
            }
            //alert(num);
            if (num == 5) {
                if (choice == 1) {
                    return 1;
                } else if (choice == 2) {
                    return 2;
                }
            }
            //  判断纵向有没有连成五子
            num = 0;
            m = x; n = y;
            while (m >= 0 && board[m][n] == choice) {
                num++;
                m--;
            }
            m = x + 1; n = y;
            while (m <= row - 1 && board[m][n] == choice) {
                num++;
                m++;
            }
            //alert(num);
            if (num == 5) {
                if (choice == 1) {
                    return 1;
                } else if (choice == 2) {
                    return 2;
                }
            }
            //  判断从右上到左下有没有连成五子
            num = 0;
            m = x; n = y;
            while (m <= row - 1 && n >= 0 && board[m][n] == choice) {
                num++;
                m++; n--;
            }
            m = x - 1; n = y + 1;
            while (m >= 0 && n <= col - 1 && board[m][n] == choice) {
                num++;
                m--; n++;
            }
            //alert(num);
            if (num == 5) {
                if (choice == 1) {
                    return 1;
                } else if (choice == 2) {
                    return 2;
                }
            }
            //  判断从左上到右下有没有连成五子
            num = 0;
            m = x; n = y;
            while (m <= row - 1 && n <= col - 1 && board[m][n] == choice) {
                num++;
                m++; n++;
            }
            m = x - 1; n = y - 1;
            while (m >= 0 && n >= 0 && board[m][n] == choice) {
                num++;
                m--; n--;
            }
            //alert(num);
            if (num == 5) {
                if (choice == 1) {
                    return 1;
                } else if (choice == 2) {
                    return 2;
                }
            }
            return 0;
        }
    </script>
</body>

</html>
